services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: savia
      POSTGRES_PASSWORD: savia_local_password
      POSTGRES_DB: spotify_challenge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - savia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savia -d spotify_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  savia_data:
